site_name: LaBrant Sales Intelligence Handbook
site_description: SE Wisconsin Commercial Painting Market Intelligence
site_url: https://labrant-associates-llc.github.io/labrant-sales-intelligence/

theme:
  name: material
  palette:
    - scheme: default
      primary: blue grey
      accent: orange
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: blue grey
      accent: orange
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.share
    - content.tabs.link
  icon:
    repo: fontawesome/brands/github

plugins:
  - search

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true
  - attr_list
  - md_in_html

nav:
  - Home: index.md
  - Chapters:
    - 1. GC Intelligence: ch1-gc-intelligence/
    - 2. Multifamily & Hospitality: ch2-multifamily-hospitality/
    - 3. Municipal Markets: ch3-municipal/
    - 4. New Markets: ch4-new-markets/
    - 5. Large Facilities Owners: ch5-large-owners/
    - 6. Internal Sales Data: ch6-internal/
  - Attachments:
    - Overview: attachments/index.md
    - A. Financial Performance: attachments/att-a-financial.md
    - E. Pricing Benchmarks: attachments/att-e-pricing.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/LaBrant-Associates-LLC/labrant-sales-intelligence
  generator: false

copyright: Copyright &copy; 2025 LaBrant & Associates LLC
