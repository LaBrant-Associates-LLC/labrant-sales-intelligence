site_name: LaBrant Sales Intelligence Handbook
site_description: SE Wisconsin Commercial Painting Market Intelligence
site_url: https://labrant-associates-llc.github.io/labrant-sales-intelligence/

theme:
  name: material
  palette:
    - scheme: default
      primary: blue grey
      accent: orange
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: blue grey
      accent: orange
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.share
    - content.tabs.link
  icon:
    repo: fontawesome/brands/github

plugins:
  - search

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true
  - attr_list
  - md_in_html

nav:
  - Home: index.md
  - Chapters:
    - 1. Operating System: ch1-operating-system.md
    - 2. Strategic Framework: ch2-strategic-framework.md
    - 3. GC Intelligence: ch3-gc-intelligence/index.md
    - 4. Municipal Markets: ch4-municipal/index.md
    - 5. Private Development: ch5-private-development.md
    - 6. Market Segments: ch6-market-segments.md
    - 7. Large Owners: ch7-large-owners.md
    - 8. Sales System: ch8-sales-system.md
  - Attachments:
    - Overview: attachments/index.md
    - A. Financial: attachments/att-a-financial.md
    - E. Pricing: attachments/att-e-pricing.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/LaBrant-Associates-LLC/labrant-sales-intelligence
  generator: false

copyright: Copyright &copy; 2025 LaBrant & Associates LLC
